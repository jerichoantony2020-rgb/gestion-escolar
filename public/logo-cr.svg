<svg viewBox="0 0 500 620" xmlns="http://www.w3.org/2000/svg" aria-label="Escudo I.E.P. Cristo Reina">
  <defs>
    <!-- Shield clip path: classic heater shield -->
    <clipPath id="sc">
      <path d="M55,185 L445,185 L445,410 Q445,520 250,590 Q55,520 55,410 Z"/>
    </clipPath>
    <!-- Gold gradients -->
    <linearGradient id="gold1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5E533"/>
      <stop offset="45%"  stop-color="#E8C800"/>
      <stop offset="100%" stop-color="#B89600"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFED66"/>
      <stop offset="55%"  stop-color="#E8C800"/>
      <stop offset="100%" stop-color="#C0A000"/>
    </linearGradient>
    <!-- Crown fill -->
    <linearGradient id="crownFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5E030"/>
      <stop offset="60%"  stop-color="#DDB800"/>
      <stop offset="100%" stop-color="#B89400"/>
    </linearGradient>
    <!-- Left shield blue -->
    <linearGradient id="blueL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1144EE"/>
      <stop offset="100%" stop-color="#0022BB"/>
    </linearGradient>
    <!-- Right shield blue -->
    <linearGradient id="blueR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#44AAFF"/>
      <stop offset="100%" stop-color="#2288DD"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CROWN -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Crown base band -->
  <path d="M100,188 Q100,155 115,155 L385,155 Q400,155 400,188 L400,200 L100,200 Z"
        fill="url(#crownFill)" stroke="#9A7A00" stroke-width="1.5"/>

  <!-- Crown outer left arch -->
  <path d="M100,188 Q100,110 145,85 Q155,80 160,60 Q162,48 150,38 Q138,28 148,20 Q158,12 168,22 Q178,32 175,48 Q172,65 182,85 Q200,120 200,185"
        fill="url(#crownFill)" stroke="#9A7A00" stroke-width="1.5"/>

  <!-- Crown center arch -->
  <path d="M200,185 Q200,110 228,78 Q238,65 240,48 Q241,33 250,24 Q259,14 268,22 Q276,30 275,45 Q273,62 282,78 Q300,110 300,185"
        fill="url(#crownFill)" stroke="#9A7A00" stroke-width="1.5"/>

  <!-- Crown outer right arch -->
  <path d="M300,185 Q300,120 318,85 Q328,65 325,48 Q322,32 332,22 Q342,12 352,20 Q362,28 350,38 Q338,48 340,60 Q345,80 355,85 Q400,110 400,188"
        fill="url(#crownFill)" stroke="#9A7A00" stroke-width="1.5"/>

  <!-- Dark olive valleys between arches -->
  <ellipse cx="200" cy="158" rx="18" ry="22" fill="#6B6600" opacity="0.85"/>
  <ellipse cx="300" cy="158" rx="18" ry="22" fill="#6B6600" opacity="0.85"/>

  <!-- Crown ball tops (circles on peaks) -->
  <!-- Left peak ball -->
  <circle cx="158" cy="22" r="14" fill="url(#gold2)" stroke="#9A7A00" stroke-width="1.5"/>
  <circle cx="158" cy="22" r="8"  fill="#F5E040" opacity="0.6"/>
  <!-- Center peak ball -->
  <circle cx="250" cy="20" r="16" fill="url(#gold2)" stroke="#9A7A00" stroke-width="1.5"/>
  <circle cx="250" cy="20" r="9"  fill="#F5E040" opacity="0.6"/>
  <!-- Right peak ball -->
  <circle cx="342" cy="22" r="14" fill="url(#gold2)" stroke="#9A7A00" stroke-width="1.5"/>
  <circle cx="342" cy="22" r="8"  fill="#F5E040" opacity="0.6"/>

  <!-- Outer small balls on crown sides -->
  <circle cx="100" cy="185" r="11" fill="url(#gold2)" stroke="#9A7A00" stroke-width="1.2"/>
  <circle cx="400" cy="185" r="11" fill="url(#gold2)" stroke="#9A7A00" stroke-width="1.2"/>

  <!-- Crown GEMS (colored circles in the crown body) -->
  <!-- Left green gem -->
  <circle cx="148" cy="145" r="10" fill="#22BB44" stroke="#006622" stroke-width="1.5"/>
  <circle cx="148" cy="145" r="5"  fill="#88EE88" opacity="0.6"/>
  <!-- Center-left red gem -->
  <circle cx="215" cy="168" r="9"  fill="#DD1111" stroke="#880000" stroke-width="1.5"/>
  <circle cx="215" cy="168" r="4"  fill="#FF7777" opacity="0.6"/>
  <!-- Right green gem -->
  <circle cx="352" cy="145" r="10" fill="#22BB44" stroke="#006622" stroke-width="1.5"/>
  <circle cx="352" cy="145" r="5"  fill="#88EE88" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SHIELD BODY -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Shield halves (clipped) -->
  <g clip-path="url(#sc)">
    <!-- Left half: royal blue -->
    <rect x="55" y="185" width="195" height="430" fill="url(#blueL)"/>
    <!-- Right half: sky blue -->
    <rect x="250" y="185" width="195" height="430" fill="url(#blueR)"/>
  </g>

  <!-- Shield thick gold outer border -->
  <path d="M55,185 L445,185 L445,410 Q445,520 250,590 Q55,520 55,410 Z"
        fill="none" stroke="url(#gold1)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Thin dark blue inner border -->
  <path d="M63,185 L437,185 L437,410 Q437,516 250,582 Q63,516 63,410 Z"
        fill="none" stroke="#0022AA" stroke-width="3"/>

  <!-- Center gold divider -->
  <line x1="250" y1="185" x2="250" y2="590" stroke="url(#gold1)" stroke-width="6"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SHIELD TEXT: Left half — I E P vertical -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <text x="155" y="285"
        text-anchor="middle" fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66" font-weight="900"
        letter-spacing="0">I</text>

  <text x="155" y="375"
        text-anchor="middle" fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66" font-weight="900">E</text>

  <text x="155" y="462"
        text-anchor="middle" fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66" font-weight="900">P</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SHIELD TEXT: Right half — UGEL N°06 + GR -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- UGEL N°06 small label -->
  <text x="347" y="218"
        text-anchor="middle" fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700"
        letter-spacing="0.5">UGEL N°06</text>

  <!-- Large GR -->
  <text x="347" y="430"
        text-anchor="middle" fill="white"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="178" font-weight="900"
        clip-path="url(#sc)">GR</text>

</svg>
